<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAE - PÁGINA DO ESTUDANTE</title>
    <link rel="shortcut icon" href="./assets/imagens/logos/sabae.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/estilos/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">
</head>

<body>
    <header class="pwa-header">
        <div class="header-left">
            <img src="./assets/imagens/logos/sabae2.webp" alt="SABAE" class="header-logo">
            <div>
                <span class="header-title">Perfil do Estudante</span>
                <div class="header-datetime">SISTEMA DE APOIO À BUSCA ATIVA ESCOLAR</div>
            </div>
        </div>
        <div class="header-right">
            <button id="menuToggle" class="header-menu" aria-label="Mais opções"><i class="ri-more-2-fill"></i></button>
            <div id="headerMenu" class="header-action-menu hidden" role="menu" aria-hidden="true">
                <button class="menu-item" data-action="request-justification">Solicitar justificativa de falta</button>
                <button class="menu-item" data-action="change-password">Alterar minha senha</button>
                <button class="menu-item" data-action="logout">Sair da conta</button>
            </div>
        </div>
    </header>

    <div id="headerEstudante" class="student-header"></div>

    <section class="month-badges">
        <div class="month-badges-title">- Referente ao ano de 2026 -</div>
        <p class="month-badges-note">Aviso: registros de anos anteriores são apagados.</p>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Janeiro</span>
                <span class="month-badge-value">84%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill green" style="width: 84%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Fevereiro</span>
                <span class="month-badge-value">46%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill red" style="width: 46%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Março</span>
                <span class="month-badge-value">100%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill green" style="width: 100%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Abril</span>
                <span class="month-badge-value">29%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill red" style="width: 29%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Maio</span>
                <span class="month-badge-value">73%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill yellow" style="width: 73%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Junho</span>
                <span class="month-badge-value">57%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill yellow" style="width: 57%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Julho</span>
                <span class="month-badge-value">12%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill red" style="width: 12%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Agosto</span>
                <span class="month-badge-value">95%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill green" style="width: 95%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Setembro</span>
                <span class="month-badge-value">66%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill yellow" style="width: 66%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Outubro</span>
                <span class="month-badge-value">38%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill red" style="width: 38%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Novembro</span>
                <span class="month-badge-value">0%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill red" style="width: 0%"></div>
            </div>
        </div>
        <div class="month-badge">
            <div class="month-badge-header">
                <span>Dezembro</span>
                <span class="month-badge-value">51%</span>
            </div>
            <div class="month-badge-track">
                <div class="month-badge-fill yellow" style="width: 51%"></div>
            </div>
        </div>
    </section>

    <script src="./assets/lógica/página-estudante.js"></script>
</body>

</html>
