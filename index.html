<style>
    * {

        padding: 0;
        box-sizing: border-box;
    }

    body {

        color: #203650;

    }

    .hero img {

        margin: 0 auto;

    }

    .hero p {
        font-size: 16px;
        margin-top: 10px;
        color: #224f8e;
    }

    .hero span {
        color: rgb(205, 177, 20);
    }

    .frases-animadas {
        display: inline-block;
        margin: 20px auto 0;
        padding: 6px 22px;
        background-color: #f8f6f0;
        border: 1px solid #d1d9e0;
        border-radius: 0;
        color: #203650;
        font-size: 18px;
        max-width: 380px;
        text-align: center;
    }

    .frases-animadas p {
        margin: 0;
        min-height: 1.4em;
    }

    section {
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .loginform {
        width: 100%;
        max-width: 360px;
        background: white;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.03);
        padding: 30px 25px;
    }

    .loginform-header {
        margin-bottom: 24px;
        text-align: center;
    }

    .loginform-header h2 {
        font-size: 22px;
        margin-bottom: 6px;
        color: #284c74;
    }

    .loginform-header p {
        font-size: 14px;
        color: #5a6370;
    }

    .loginform label {
        display: block;
        font-size: 14px;
        color: rgb(83, 86, 88);
        margin-top: 16px;
    }

    .loginform input,
    .loginform select {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: 1px solid #d1d9e0;
        border-radius: 2px;
        background: #f7fafc;
        color: #203650;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .loginform select {
        background-image: linear-gradient(45deg, transparent 50%, #203650 50%),
            linear-gradient(135deg, #203650 50%, transparent 50%);
        background-position: calc(100% - 18px) calc(50% - 4px), calc(100% - 14px) calc(50% - 4px);
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
    }

    .loginform button {
        width: 100%;
        margin-top: 22px;
        padding: 12px 0;
        background-color: rgb(40, 136, 201);
        color: white;
        border: none;
        border-radius: 2px;
        font-size: 16px;
        cursor: pointer;
    }

    .loginform button:hover {
        background-color: rgb(28, 108, 170);
    }

    .alt-access {
        display: flex;
        justify-content: center;
        margin: 0 20px 20px;
    }

    .alt-access button {
        padding: 10px 24px;
        border: none;
        border-radius: 3px;
        background-color: #f1a82a;
        color: #203650;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: -10px;
    }

    .alt-access button:hover {
        background-color: #d99e28;
    }

    .footer {
        text-align: center;
        padding: 16px 20px;
        font-size: 13px;
        color: #5a6370;
        background: #ffffff;
        border-top: 1px solid #d1d9e0;
    }

    .footer strong {
        color: #203650;
    }

    .loader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(32, 54, 80, 0.65);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
    }

    .loader-overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: all;
    }

    .loader-box {
        width: 220px;
        padding: 24px;
        background: #ffffff;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
    }

    .loader-spinner {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        border: 6px solid #d1d9e0;
        border-top-color: #2878c9;
        border-radius: 50%;
    }

    .loader-text {
        font-size: 15px;
        color: #203650;
        margin: 0;
    }

    @media (max-width: 600px) {
        .hero p {
            font-size: 14px;
        }

        .alt-access {
            margin: 0 10px 20px;
        }

        .loginform {
            margin: 0 10px;
        }
    }
</style>

<body>
    <div class="hero">
        <img src="./assets/imagens/logos/sabae-com.webp" alt="Logo SABAE">
        <p><span>SISTEMA DE APOIO À BUSCA ATIVA ESCOLAR</span></p>
        <p>Olá, seja bem vindo(a) ao SABAE!</p>
        <div class="frases-animadas">
            <p>...</p>
        </div>
    </div>
    <div class="alt-access">
        <a href="login.html">
            <button type="button">Acesso alternativo (Monitor) <i class="ri-arrow-right-line"></i> </button>
        </a>
    </div>
    <section>
        <div class="loginform">
            <div class="loginform-header">
                <h2>Sou aluno</h2>
                <p>Informe seu Nome Completo e Matrícula para acessar sua frequência.</p>
            </div>
            <form autocomplete="off" spellcheck="false" novalidate>
                <!-- Campos ocultos para dificultar o autofill de navegadores -->
                <input type="text" name="fakeusernameremembered" id="fakeusernameremembered" autocomplete="off"
                    style="display:none">
                <input type="password" name="fakepasswordremembered" autocomplete="new-password" style="display:none">

                <label for="username"><i class="ri-user-line"></i> Nome completo</label>
                <input type="text" id="username" name="user_fullname" placeholder="Ex. João Guilherme Pereira da Silva"
                    autocomplete="off" autocorrect="off" autocapitalize="off" required>

                <label for="password"><i class="ri-lock-line"></i> Matrícula</label>
                <input type="password" id="password" name="matricula" placeholder="Ex. 123456"
                    autocomplete="new-password" autocorrect="off" autocapitalize="off" required>

                <label for="modulo">Escola:</label>
                <select id="modulo" name="modulo" required>
                    <option value="">Selecione a escola</option>
                    <option value="Escola Dom Bosco - Ensino Fundamental e Médio">Escola Dom Bosco - Ensino Fundamental
                        e Médio</option>
                </select>
                <button type="submit">Continuar</button>
            </form>
        </div>
    </section>

    <div id="loader-overlay" class="loader-overlay">
        <div class="loader-box">
            <div class="loader-spinner" id="loader-spinner"></div>
            <p class="loader-text" id="loader-text">Validando dados...</p>
        </div>
    </div>

    </section>
    <footer class="footer">
        Desenvolvido por <strong>Weslley Kholson Felintro Alves</strong> - Analista e Desenvolvedor de Sistemas |
        Graduando na <a href="https://www.fiap.com.br" target="_blank">FIAP</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/lógica/supabase-config.js"></script>
    <script src="./assets/lógica/auth.js"></script>
    <script>
        const frases = [
            "Estudar é o maior investimento que podes fazer em ti mesmo. — William Arthur Lewis",
            "A coisa mais bonita sobre o aprendizado é que ninguém pode tirá-lo de você. — B.B. King",
            "Juntos construímos um futuro melhor!",
            "Investir em conhecimento rende sempre os melhores juros. — Benjamin Franklin",
            "Eu não tenho nenhum talento especial. Sou apenas apaixonadamente curioso. — Albert Einstein"
        ];

        const fraseEl = document.querySelector('.frases-animadas p');
        let ordemFrases = [];
        let indiceFrase = 0;

        function embaralhar(array) {
            const copiada = [...array];
            for (let i = copiada.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copiada[i], copiada[j]] = [copiada[j], copiada[i]];
            }
            return copiada;
        }

        function iniciarOrdemAleatoria() {
            ordemFrases = embaralhar(frases);
            indiceFrase = 0;
            fraseEl.textContent = ordemFrases[indiceFrase];
        }

        function trocarFrase() {
            gsap.to(fraseEl, {
                duration: 0.4333666999333555222,
                opacity: 0,
                y: -12,
                ease: 'power2.in',
                onComplete() {
                    indiceFrase += 1;
                    if (indiceFrase >= ordemFrases.length) {
                        ordemFrases = embaralhar(frases);
                        indiceFrase = 0;
                    }
                    fraseEl.textContent = ordemFrases[indiceFrase];
                    gsap.fromTo(fraseEl,
                        { opacity: 0, y: 12 },
                        { duration: 0.8, opacity: 1, y: 0, ease: 'power2.out' });
                }
            });
        }

        iniciarOrdemAleatoria();

        gsap.from('.frases-animadas', {
            duration: 1,
            opacity: 0,
            y: 20,
            ease: 'power2.out'
        });

        setInterval(trocarFrase, 9000);
    </script>

    <script>
        async function buscarAlunoPorMatriculaENome(matricula, nome) {
            try {
                const usuario = await obterUsuarioAtual().catch(() => null);
                const emailUsuario = usuario?.email || '';

                const { data, error } = await supabaseClient.rpc('buscar_aluno_por_matricula_nome_nativo', {
                    p_email_usuario: emailUsuario,
                    p_matricula: matricula,
                    p_nome: nome
                });

                if (error) {
                    throw error;
                }

                return data;
            } catch (erro) {
                console.error('Erro ao buscar aluno:', erro);
                throw erro;
            }
        }

        function mostrarLoader() {
            const overlay = document.getElementById('loader-overlay');
            const spinner = document.getElementById('loader-spinner');
            overlay.classList.add('active');
            gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: 0.35 });
            gsap.fromTo(spinner, { rotation: 0 }, { rotation: 360, duration: 1, repeat: -1, ease: 'linear' });
        }

        function esconderLoader() {
            const overlay = document.getElementById('loader-overlay');
            overlay.classList.remove('active');
        }

        const CACHE_KEY = 'sabae_aluno_cache';
        const CACHE_TTL_MS = 5 * 60 * 60 * 1000; // 5 horas

        function salvarAlunoNoCache(dadosAluno) {
            const cache = {
                timestamp: Date.now(),
                aluno: dadosAluno
            };
            localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        }

        function obterAlunoDoCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const cache = JSON.parse(raw);
                if (!cache || !cache.timestamp || !cache.aluno) return null;
                if (Date.now() - cache.timestamp > CACHE_TTL_MS) {
                    localStorage.removeItem(CACHE_KEY);
                    return null;
                }
                return cache.aluno;
            } catch (erro) {
                console.warn('Erro ao ler cache do aluno:', erro);
                localStorage.removeItem(CACHE_KEY);
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const formulario = document.querySelector('.loginform form');
            if (!formulario) return;

            formulario.addEventListener('submit', async function (event) {
                event.preventDefault();

                const nome = document.getElementById('username').value.trim();
                const matricula = document.getElementById('password').value.trim();

                if (!nome || !matricula) {
                    alert('Por favor, informe Nome Completo e Matrícula.');
                    return;
                }

                const alunoEmCache = obterAlunoDoCache();
                if (alunoEmCache && alunoEmCache.matricula === matricula && alunoEmCache.nome.toLowerCase() === nome.toLowerCase()) {
                    mostrarLoader();
                    setTimeout(() => {
                        window.location.href = 'página-estudante.html';
                    }, 700);
                    return;
                }

                mostrarLoader();

                try {
                    const resultado = await buscarAlunoPorMatriculaENome(matricula, nome);

                    if (!resultado || !resultado.sucesso) {
                        esconderLoader();
                        alert(resultado?.mensagem || 'Aluno não encontrado. Verifique os dados.');
                        return;
                    }

                    salvarAlunoNoCache(resultado.dados);
                    gsap.to('#loader-overlay', {
                        opacity: 0, duration: 0.3, delay: 0.5, onComplete() {
                            window.location.href = 'página-estudante.html';
                        }
                    });
                } catch (erro) {
                    esconderLoader();
                    alert('Erro ao consultar o aluno. Tente novamente mais tarde.');
                }
            });
        });
    </script>
</body>

</html>
