<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAE - SISTEMA DE APOIO À BUSCA ATIVA ESCOLAR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f0f4f8;
        color: #203650;
    }

    .hero {
        text-align: center;
        padding: 30px 20px 10px;
    }

    .hero img {
        width: 240px;
        margin: 0 auto;
        display: block;
    }

    .hero p {
        font-size: 16px;
        margin-top: 10px;
        color: #224f8e;
    }

    .hero span {
        color: rgb(205, 177, 20);
    }

    .frases-animadas {
        display: inline-block;
        margin: 20px auto 0;
        padding: 6px 22px;
        background-color: #f8f6f0;
        border: 1px solid #d1d9e0;
        border-radius: 0;
        color: #203650;
        font-size: 18px;
        max-width: 380px;
        text-align: center;
    }

    .frases-animadas p {
        margin: 0;
        min-height: 1.4em;
    }

    section {
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .loginform {
        width: 100%;
        max-width: 360px;
        background: white;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        padding: 30px 25px;
    }

    .loginform-header {
        margin-bottom: 24px;
        text-align: center;
    }

    .loginform-header h2 {
        font-size: 22px;
        margin-bottom: 6px;
        color: #284c74;
    }

    .loginform-header p {
        font-size: 14px;
        color: #5a6370;
    }

    .loginform label {
        display: block;
        font-size: 14px;
        color: rgb(83, 86, 88);
        font-weight: bold;
        margin-top: 16px;
    }

    .loginform input,
    .loginform select {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: 1px solid #d1d9e0;
        border-radius: 8px;
        background: #f7fafc;
        color: #203650;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .loginform select {
        background-image: linear-gradient(45deg, transparent 50%, #203650 50%),
            linear-gradient(135deg, #203650 50%, transparent 50%);
        background-position: calc(100% - 18px) calc(50% - 4px), calc(100% - 14px) calc(50% - 4px);
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
    }

    .loginform button {
        width: 100%;
        margin-top: 22px;
        padding: 12px 0;
        background-color: rgb(40, 136, 201);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .loginform button:hover {
        background-color: rgb(28, 108, 170);
    }

    .alt-access {
        display: flex;
        justify-content: center;
        margin: 0 20px 20px;
    }

    .alt-access button {
        padding: 10px 24px;
        border: none;
        border-radius: 3px;
        background-color: #f1a82a;
        color: #203650;
        font-size: 15px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: -10px;
    }

    .alt-access button:hover {
        background-color: #d99e28;
    }

    .footer {
        text-align: center;
        padding: 16px 20px;
        font-size: 13px;
        color: #5a6370;
        background: #ffffff;
        border-top: 1px solid #d1d9e0;
    }

    .footer strong {
        color: #203650;
    }

    @media (max-width: 600px) {
        .hero p {
            font-size: 14px;
        }

        .alt-access {
            margin: 0 10px 20px;
        }

        .loginform {
            margin: 0 10px;
        }
    }
</style>

<body>
    <div class="hero">
        <img src="./assets/imagens/logos/sabae-com.webp" alt="Logo SABAE">
        <p><span>SISTEMA DE APOIO À BUSCA ATIVA ESCOLAR</span></p>
        <p>Olá, seja bem vindo(a) ao SABAE!</p>
        <div class="frases-animadas">
  <p>...</p>
        </div>
    </div>
    <div class="alt-access">
        <a href="login.html">
            <button type="button">Acesso alternativo (Monitor)</button>
        </a>
    </div>
    <section>
        <div class="loginform">
            <div class="loginform-header">
                <h2>Sou aluno</h2>
                <p>Informe seu usuário e senha para acessar sua frequência.</p>
            </div>
            <form autocomplete="off" spellcheck="false" novalidate>
                <!-- Campos ocultos para dificultar o autofill de navegadores -->
                <input type="text" name="fakeusernameremembered" id="fakeusernameremembered" autocomplete="off"
                    style="display:none">
                <input type="password" name="fakepasswordremembered" autocomplete="new-password" style="display:none">

                <label for="username"><i class="ri-user-line"></i> Nome completo</label>
                <input type="text" id="username" name="user_fullname" placeholder="Ex. João Guilherme Pereira da Silva"
                    autocomplete="off" autocorrect="off" autocapitalize="off" required>

                <label for="password"><i class="ri-lock-line"></i> Matrícula</label>
                <input type="password" id="password" name="matricula" placeholder="Ex. 123456"
                    autocomplete="new-password" autocorrect="off" autocapitalize="off" required>

                <label for="modulo">Escola:</label>
                <select id="modulo" name="modulo" required>
                    <option value="">Selecione a escola</option>
                    <option value="Escola Dom Bosco - Ensino Fundamental e Médio">Escola Dom Bosco - Ensino Fundamental
                        e Médio</option>
                </select>
                <button type="submit">Continuar</button>
            </form>
        </div>

    </section>
    <footer class="footer">
        Desenvolvido por <strong>Weslley Kholson Felintro Alves</strong> - Analista e Desenvolvedor de Sistemas |
        Graduando na <a href="https://www.fiap.com.br" target="_blank">FIAP</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const frases = [
            "Estudar é o maior investimento que podes fazer em ti mesmo. — William Arthur Lewis",
            "A coisa mais bonita sobre o aprendizado é que ninguém pode tirá-lo de você. — B.B. King",
            "Juntos construímos um futuro melhor!",
            "Investir em conhecimento rende sempre os melhores juros. — Benjamin Franklin",
            "Eu não tenho nenhum talento especial. Sou apenas apaixonadamente curioso. — Albert Einstein"
        ];

        const fraseEl = document.querySelector('.frases-animadas p');
        let ordemFrases = [];
        let indiceFrase = 0;

        function embaralhar(array) {
            const copiada = [...array];
            for (let i = copiada.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copiada[i], copiada[j]] = [copiada[j], copiada[i]];
            }
            return copiada;
        }

        function iniciarOrdemAleatoria() {
            ordemFrases = embaralhar(frases);
            indiceFrase = 0;
            fraseEl.textContent = ordemFrases[indiceFrase];
        }

        function trocarFrase() {
            gsap.to(fraseEl, {
                duration: 0.4333,
                opacity: 0,
                y: -12,
                ease: 'power2.in',
                onComplete() {
                    indiceFrase += 1;
                    if (indiceFrase >= ordemFrases.length) {
                        ordemFrases = embaralhar(frases);
                        indiceFrase = 0;
                    }
                    fraseEl.textContent = ordemFrases[indiceFrase];
                    gsap.fromTo(fraseEl,
                        {opacity: 0, y: 12},
                        {duration: 0.8, opacity: 1, y: 0, ease: 'power2.out'});
                }
            });
        }

        iniciarOrdemAleatoria();

        gsap.from('.frases-animadas', {
            duration: 1,
            opacity: 0,
            y: 20,
            ease: 'power2.out'
        });

        setInterval(trocarFrase, 9000);
    </script>
</body>

</html>
